# ===========================================================================
# ANSWERABLE (9) -- YOURS
#
# The corpus answers it and the agent should generate. Use `note` to say what a
# correct answer must contain, as a claim rather than as wording, since a judge
# reads it rather than matching strings.
#
# Two of the three starter chips belong here, since they are the only questions
# guaranteed to be asked:
#   "What broke while building ESMON?"
#   "How does Noiseless keep a human in the loop?"
#
# Worth including at least one where the honest answer is unflattering. That is
# the only moment the colleague voice separates from a publicist, and nothing
# else in the set tests it.
# ===========================================================================

- id: ans-001
  question: ""
  stratum: answerable
  expect: answer
  note: ""

